services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: lol
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: lol
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lol"]
      interval: 2s
      retries: 10

volumes:
  pgdata: